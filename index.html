<html lang="zh-CN">
<head>

<title>长歌 API · 云端接口聚合</title>

<style>
  :root{
    --bg:#060a18;
    --text:#eef2ff;
    --text2:#9aa6c8;
    --text3:#6b7698;
    --line:rgba(255,255,255,.16);
    --glass:rgba(255,255,255,.07);
    --glass-strong:rgba(255,255,255,.10);
    --accent1:#7dd3fc;
    --accent2:#a78bfa;
    --radius:22px;
    --shadow:0 10px 40px rgba(3,6,20,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .aurora{
    position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(52% 44% at 12% 18%, rgba(79,70,229,.34) 0%, transparent 62%),
      radial-gradient(46% 40% at 86% 12%, rgba(225,29,143,.24) 0%, transparent 60%),
      radial-gradient(50% 46% at 78% 78%, rgba(245,158,11,.16) 0%, transparent 62%),
      radial-gradient(48% 42% at 16% 82%, rgba(34,211,238,.18) 0%, transparent 60%),
      linear-gradient(160deg,#0a1028 0%, #060a18 55%, #0a0d22 100%);
  }
  .aurora::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.5) 0%, transparent 60%),
      radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.4) 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 40% 60%, rgba(255,255,255,.35) 0%, transparent 60%),
      radial-gradient(1px 1px at 85% 45%, rgba(255,255,255,.3) 0%, transparent 60%);
    background-size:360px 360px, 480px 480px, 420px 420px, 520px 520px;
    opacity:.35;
  }
  #sakura{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    opacity:.9;
  }
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(170%);
    backdrop-filter:blur(24px) saturate(170%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .wrap{max-width:1200px;margin:0 auto;padding:0 22px}
  nav{
    position:sticky;top:14px;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:10px 14px;margin:14px auto 0;max-width:1200px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--line);
    box-shadow:0 8px 32px rgba(3,6,20,.4), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.4px}
  .brand .logo{
    width:30px;height:30px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(125,211,252,.35);
  }
  .brand .logo svg{width:16px;height:16px}
  .nav-links{display:flex;align-items:center;gap:4px}
  .nav-links a{
    color:var(--text2);text-decoration:none;font-size:13.5px;font-weight:500;
    padding:7px 13px;border-radius:999px;transition:color .2s, background .2s;
  }
  .nav-links a:hover{color:var(--text);background:rgba(255,255,255,.08)}
  .nav-status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
  header.hero{padding:86px 0 34px;text-align:center}
  .hero .kicker{
    display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--accent1);
    padding:6px 14px;border-radius:999px;margin-bottom:22px;
    background:rgba(125,211,252,.08);border:1px solid rgba(125,211,252,.25);
  }
  .hero h1{
    font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.5px;line-height:1.12;
    background:linear-gradient(120deg,#fff 20%,var(--accent1) 55%,var(--accent2) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p.sub{color:var(--text2);font-size:16px;margin-top:16px;max-width:640px;margin-inline:auto;line-height:1.7}
  .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}
  .stat{
    padding:12px 22px;border-radius:16px;text-align:center;min-width:108px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  }
  .stat b{display:block;font-size:24px;font-weight:800;color:#fff}
  .stat span{font-size:12px;color:var(--text2)}
  .toolbar{margin:26px 0 18px;padding:13px 14px 0;
    border-radius:20px;background:rgba(10,14,32,.85);
    -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);

  .search-box{display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .search-box svg{flex:none;width:18px;height:18px;stroke:var(--text2)}
  .search-box input{
    flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font-size:15px;font-family:inherit;
  }
  .search-box input::placeholder{color:var(--text3)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;cursor:pointer;user-select:none;
    padding:8px 15px;border-radius:999px;font-size:13px;color:var(--text2);
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    transition:all .18s;
  }
  .chip:hover{color:var(--text);background:rgba(255,255,255,.10)}
  .chip.on{color:#060a18;background:linear-gradient(135deg,var(--accent1),var(--accent2));border-color:transparent;font-weight:600}
  .chip .cnt{opacity:.65;font-size:11.5px;margin-left:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding-bottom:40px}
  .card{
    position:relative;padding:20px 20px 16px;border-radius:var(--radius);
    display:flex;flex-direction:column;gap:10px;
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.32);background:var(--glass-strong)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card-cat{
    font-size:11px;color:var(--accent1);padding:3px 10px;border-radius:999px;
    background:rgba(125,211,252,.10);border:1px solid rgba(125,211,252,.22);

  .card-ok{display:flex;align-items:center;gap:5px;font-size:11px;color:#6ee7a8}
  .card-ok i{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 6px #34d399}

  .card .ep{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    font-size:12px;color:var(--text2);background:rgba(6,10,24,.4);
    border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:8px 10px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all;
  }
  .card-actions{display:flex;gap:8px;margin-top:2px}
  .btn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 12px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.07);
    text-decoration:none;transition:background .18s, border-color .18s;font-family:inherit;
  }

  .btn.primary{

  }
  .btn.primary:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--accent1),var(--accent2))}
  .btn svg{width:14px;height:14px;flex:none}
  .empty{
    text-align:center;padding:70px 20px;color:var(--text3);font-size:15px;
    border:1px dashed rgba(255,255,255,.15);border-radius:var(--radius);
  }

  .contact{padding:26px 28px;display:grid;grid-template-columns:1fr;gap:18px}
  .contact h3{font-size:17px;margin-bottom:4px}
  .contact .hint{font-size:12.5px;color:var(--text3);margin-bottom:14px}
  .c-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(6,10,24,.35);border:1px solid rgba(255,255,255,.09);margin-bottom:10px}

    flex:none;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text2);
    border-radius:10px;padding:6px 12px;font-size:12px;font-family:inherit;transition:all .18s;
  }
  .c-row button:hover{color:var(--text);background:rgba(255,255,255,.13)}
  footer .footnote{text-align:center;font-size:12px;color:var(--text3);margin-top:18px;line-height:1.8}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(20,26,48,.92);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:999px;
    border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:760px){
    nav{flex-wrap:wrap;border-radius:20px}
    .nav-links{order:3;width:100%;justify-content:space-between;border-top:1px solid rgba(255,255,255,.08);padding-top:6px;margin-top:2px}
    .nav-links a{min-height:44px;display:inline-flex;align-items:center}
    .nav-status{display:none}
    header.hero{padding:60px 0 24px}
    .toolbar{top:auto;position:static}
    .search-box input{font-size:16px}
    .chip{font-size:14px;padding:10px 16px}
    .chip .cnt{font-size:12px}
    .btn{min-height:44px}
    .card p{font-size:14px}
    .stat span{font-size:13px}
    .hero .kicker{font-size:13px}
    .c-row button{min-height:44px}
    .contact{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
    html{scroll-behavior:auto}
  }
  :focus-visible{outline:2px solid var(--accent1);outline-offset:2px;border-radius:8px}
</style>

<script>
(function(){
  "use strict";
  var cv = document.getElementById("sakura");
  if(!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();
  var N = reduced ? 0 : 30;
  var P = [];
  function make(anywhere){
    var z = anywhere ? Math.random() : 0.2 + Math.random() * 0.8;
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -60 - Math.random() * H * 0.4,
      z: z,
      s: (8 + Math.random() * 12) * (1.5 - z * 0.85),
      vy: (22 + Math.random() * 40) * (1.35 - z * 0.5),
      amp: 14 + Math.random() * 26,
      spd: 0.4 + Math.random() * 1.1,
      ph: Math.random() * Math.PI * 2,
      a: Math.random() * Math.PI * 2,
      va: (Math.random() * 1.3 - 0.65) * 0.018 * (2 - z)
    };
  }
  for(var i = 0; i < N; i++) P.push(make(true));
  var t0 = Date.now();
  function petal(x, y, s, alpha, rot){
    var w = s * 0.62, h = s * 0.86;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    var g = ctx.createLinearGradient(0, -h * 0.55, 0, h * 0.6);
    g.addColorStop(0, "#ffd6cd");
    g.addColorStop(0.55, "#ffb0a6");
    g.addColorStop(1, "#ff9a94");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.5);
    ctx.bezierCurveTo(w * 0.55, -h * 0.30, w * 0.42, h * 0.30, 0, h * 0.5);
    ctx.bezierCurveTo(-w * 0.30, h * 0.34, -w * 0.38, -h * 0.26, 0, -h * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = alpha * 0.35;
    ctx.fillStyle = "#ffe9e2";
    ctx.beginPath();
    ctx.ellipse(-w * 0.16, -h * 0.12, w * 0.20, h * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function frame(){
    var now = Date.now();
    var dt = Math.min(50, now - t0) / 1000;
    t0 = now;
    ctx.clearRect(0, 0, W, H);
    var t = now / 1000;
    for(var i = 0; i < P.length; i++){
      var p = P[i];
      p.y += p.vy * dt;
      p.a += p.va * dt * 60;
      var sx = p.x + Math.sin(t * p.spd + p.ph) * p.amp;
      if(p.y > H + 80 || sx < -80 || sx > W + 80){
        P[i] = make(false);
        continue;
      }
      petal(sx, p.y, p.s, (0.12 + 0.30 * p.z) * 0.7, p.a + p.ph * 0.1);
    }
    requestAnimationFrame(frame);
  }
  if(!reduced) requestAnimationFrame(frame);
})();
</script>

  var CATS = {
    "music":"音乐","hot":"热榜","video":"视频","img":"图片壁纸","quote":"语录文案",
    "idiom":"成语汉字","weather":"天气","chat":"翻译聊天","tool":"工具计算","query":"查询",
    "ip":"IP定位","site":"网站检测","qq":"QQ","page":"页面工具","other":"其他",
    "intl":"国外API"
  };
  var grid = document.getElementById("grid");
  var chipsBox = document.getElementById("chips");
  var searchInput = document.getElementById("search");
  var toast = document.getElementById("toast");
  var curCat = "all";
  var toastTimer = null;

  function isExt(p){ return /^https?:\/\//.test(p); }
  function endpoint(p){ return p; }
  function docHref(p, ep){ return ep; }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 1800);
  }
  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        showToast("已复制： " + txt);
      }, function(){ fallbackCopy(txt); });
    } else { fallbackCopy(txt); }
  }
  function fallbackCopy(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast("已复制： " + txt); }
    catch(e){ showToast("复制失败，请手动复制"); }
    document.body.removeChild(ta);
  }
  function buildChips(){
    var counts = {};
    DATA.forEach(function(it){ counts[it[2]] = (counts[it[2]]||0)+1; });
    var html = '<div class="chip on" data-cat="all">全部<span class="cnt">'+DATA.length+'</span></div>';
    Object.keys(CATS).forEach(function(k){
      if(!counts[k]) return;
      html += '<div class="chip" data-cat="'+k+'">'+CATS[k]+'<span class="cnt">'+counts[k]+'</span></div>';
    });
    chipsBox.innerHTML = html;
    chipsBox.querySelectorAll(".chip").forEach(function(ch){
      ch.addEventListener("click", function(){
        chipsBox.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("on"); });
        ch.classList.add("on");
        curCat = ch.getAttribute("data-cat");
        render();
      });
    });
  }
  function render(){
    var q = searchInput.value.trim().toLowerCase();
    var list = DATA.filter(function(it){
      if(curCat !== "all" && it[2] !== curCat) return false;
      if(!q) return true;
      return (it[0] + it[3] + CATS[it[2]]).toLowerCase().indexOf(q) !== -1;
    });
    if(!list.length){
      grid.innerHTML = '<div class="empty">没有找到匹配的接口，换个关键词试试</div>';
      return;
    }
    var html = "";
    list.forEach(function(it){
      var n=it[0], p=it[1], c=it[2], d=it[3], ep=endpoint(p);
      html += '<article class="card glass">'
        + '<div class="card-top"><span class="card-cat">'+CATS[c]+'</span><span class="card-ok"><i></i>正常</span></div>'
        + '<h3>'+n+'</h3><p>'+d+'</p>'
        + '<div class="ep">'+ep+'</div>'
        + '<div class="card-actions">'
        + '<button type="button" class="btn" data-copy="'+ep+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制地址</button>'
        + '<a class="btn primary" href="'+docHref(p, ep)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>接口文档</a>'
        + '</div></article>';
    });
    grid.innerHTML = html;
    grid.querySelectorAll("[data-copy]").forEach(function(btn){
      btn.addEventListener("click", function(){ copyText(btn.getAttribute("data-copy")); });
    });
  }
  document.querySelectorAll("[data-copy]").forEach(function(btn){
    btn.addEventListener("click", function(){ copyText(btn.getAttribute("data-copy")); });
  });
  searchInput.addEventListener("input", render);
  document.getElementById("st-total").textContent = DATA.length;
  document.getElementById("st-cat").textContent = Object.keys(CATS).filter(function(k){ return DATA.some(function(it){ return it[2]===k; }); }).length;
  document.getElementById("st-free").textContent = DATA.length;
  buildChips();
  render();
})();
</script>
