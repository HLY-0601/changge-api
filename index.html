.chip.on{color:#0a1024;background:linear-gradient(135deg,#7dd3fc,#a78bfa);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding-bottom:40px}
.card{padding:18px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:9px}

.row{display:flex;gap:8px}
.btn{flex:1;text-align:center;padding:8px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid rgba(255,255,255,.14);color:#eef2ff;background:rgba(255,255,255,.06)}
.btn.p{background:linear-gradient(135deg,#7dd3fc,#a78bfa);color:#0a1024;border:none}
footer{text-align:center;padding:20px 0 50px;color:#6b7698;font-size:13px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(20,26,48,.95);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style></head><body>

const CATS={img:"图片壁纸",quote:"语录文案",hot:"热榜",tool:"工具",intl:"国外API"};
let cur="all";
const $=s=>document.querySelector(s);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast("已复制"),()=>{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove();toast("已复制")})}
function chips(){
 const c={};DATA.forEach(i=>c[i[2]]=(c[i[2]]||0)+1);
 let h='<span class="chip on" data-c="all">全部 '+DATA.length+'</span>';
 Object.keys(c).forEach(k=>h+='<span class="chip" data-c="'+k+'">'+(CATS[k]||k)+' '+c[k]+'</span>');
 $("#chips").innerHTML=h;
 document.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{document.querySelectorAll(".chip").forEach(y=>y.classList.remove("on"));x.classList.add("on");cur=x.dataset.c;render()});
}
function render(){
 const q=$("#search").value.trim().toLowerCase();
 const l=DATA.filter(i=>(cur==="all"||i[2]===cur)&&(!q||(i[0]+i[3]+(CATS[i[2]]||"")).toLowerCase().includes(q)));
 if(!l.length){$("#grid").innerHTML='<p style="padding:60px;color:#6b7698">没有找到匹配接口</p>';return}
 let h="";
 l.forEach(i=>{const n=i[0],p=i[1],d=i[3];
  h+='<div class="card"><div class="cat">'+(CATS[i[2]]||i[2])+'</div><h3>'+n+'</h3><p>'+d+'</p><div class="ep">'+p+'</div><div class="row"><button class="btn" onclick="copy(\''+p+'\')">复制地址</button><a class="btn p" target="_blank" href="'+p+'">接口</a></div></div>'});
 $("#grid").innerHTML=h;
}
$("#search").oninput=render;
$("#s1").textContent=DATA.length;$("#s2").textContent=Object.keys(CATS).filter(k=>DATA.some(i=>i[2]===k)).length;
chips();render();
</script></body></html>
